name: Build and Release Universal Video Downloader

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller --onefile --windowed main.py
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal_video_downloader_win
          path: dist/main.exe

  build-linux:
    name: Build Linux Executable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller --onefile --windowed main.py
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal_video_downloader_linux
          path: dist/main

  build-macos:
    name: Build macOS Executable
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          brew install ffmpeg
          pip install -r requirements.txt pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller --onefile --windowed main.py
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal_video_downloader_mac
          path: dist/main

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: universal_video_downloader_win
          path: artifacts/
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: universal_video_downloader_linux
          path: artifacts/
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: universal_video_downloader_mac
          path: artifacts/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Universal Video Downloader ${{ github.ref_name }}"
          draft: true
          files: |
            artifacts/main.exe
            artifacts/main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}